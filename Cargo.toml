[package]
name = "tempsystem"
version = "0.1.0"
edition = "2024"

[features]
default = []
generators = ["dep:clap_complete", "dep:clap_mangen"]

[dependencies]
bollard = "0.21.1"
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = { version = "4.6.9", optional = true }
clap_mangen = { version = "0.3.3", optional = true }
colorize = "0.1.0"
futures-util = "0.3.34"
indicatif = { version = "0.18.6", features = ["tokio"] }
nix = { version = "0.31.3", features = ["user"] }
tar = "0.4.46"
termion = "4.0.6"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = [
	"macros",
	"rt-multi-thread",
	"signal",
] }
tokio-util = "0.7.19"

version = { path = "./version" }

[lints.clippy]
needless_return = "allow"
